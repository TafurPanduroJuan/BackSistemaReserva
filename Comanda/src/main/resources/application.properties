# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL DataSource ─────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
comanda.security.jwt.secret=${JWT_SECRET}
comanda.security.jwt.expiration-ms=28800000

# ── CORS ──────────────────────────────────────────────────────────────────────
comanda.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/comanda/api-docs
springdoc.api-docs.path=/comanda/api-docs/json
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
# ── Notificaciones por Email ───────────────────────────────────────────────────
# Cambiar a true y configurar las variables de entorno para activar emails reales
comanda.mail.enabled=${MAIL_ENABLED:false}
comanda.mail.from=${MAIL_FROM:noreply@comanda.pe}
comanda.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Configuración SMTP (descomentar y configurar para producción):
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true