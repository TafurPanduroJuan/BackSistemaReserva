# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
# ── SQLite DataSource ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:comanda.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# IMPORTANTE: usar "update" en vez de "create" para no borrar datos al reiniciar
# Usa "create" solo la primera vez para crear las tablas, luego cambia a "update"
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SQLite no soporta getGeneratedKeys() por defecto con algunos drivers
# Esta config evita errores de batch insert
spring.jpa.properties.hibernate.jdbc.batch_size=0